[build]
  base = "."
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_ENABLE_LOCAL_AUTH = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect root to app
[[redirects]]
  from = "/"
  to = "/login"
  status = 302
  force = false
