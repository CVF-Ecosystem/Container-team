# ============================================================
# Tan Thuan Port API - Docker Compose
# ============================================================
# IMPORTANT: Copy .env.production.example to .env and fill in values
# before running: cp .env.production.example .env
# Generate JWT_SECRET: openssl rand -base64 64
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: tanthuan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tanthuan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanthuan-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-tanthuan}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - generate with: openssl rand -base64 64}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tanthuan.internal}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env

volumes:
  postgres_data:
